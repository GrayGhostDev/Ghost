# Ghost Backend — Level 2 Core Framework
# Canonical location: ~/Business/GGDC-System/ghost-backend/
# Phase 4+ — joined ggdc-shared-net for Level 2 observability + Traefik routing

name: "ghost-backend"

# ── Secrets ──────────────────────────────────────────────────────────────────
# File-backed, generated by scripts/init-docker-secrets.sh (run it once before
# the first `docker compose up`). tools/docker-entrypoint.sh reads /run/secrets/*
# into the environment before the Python entrypoint runs.
#
# These files are REQUIRED, not optional: Compose fails container creation with
# "bind source path does not exist" if a declared secret file is missing. There
# is no fallback to `environment:`.
#
# Only JWT_SECRET and API_KEY live here. DB_PASSWORD and REDIS_PASSWORD stay in
# `environment:` on purpose — postgres and redis read their own copy from the
# same compose variable, so moving only the client half to a secret would let
# the two sides drift and fail authentication. Migrating those too means
# POSTGRES_PASSWORD_FILE plus a redis entrypoint shim (see
# the-system/infrastructure/docker/redis-entrypoint.sh); tracked as follow-up.
secrets:
  jwt_secret:
    file: ./.secrets/jwt_secret
  api_key:
    file: ./.secrets/api_key

# ── Shared fragments ─────────────────────────────────────────────────────────
# Mirrors the-system/docker-compose.yml:85-124 so the two stacks age together.
x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service"

# NOTE: deploy.resources is ignored by podman-compose and by `docker compose up`
# outside Swarm. It is declarative intent, honoured in Swarm and translated for
# Cloud Run. For a local cap use: docker update --cpus=1.0 --memory=1g <container>
x-default-resources: &default-resources
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 256M

x-small-resources: &small-resources
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M
      reservations:
        cpus: "0.1"
        memory: 128M

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: ghost-backend:latest
    container_name: ghost-be-api
    <<: *default-resources
    ports:
      # Bind only to localhost for security. Use reverse proxy for external access
      - "127.0.0.1:8801:8801"
    environment:
      # Application settings
      - ENVIRONMENT=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8801
      - WORKERS=1
      
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ghost
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-ghost_password}
      
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      
      # Security keys — development fallback only. In any shared environment
      # these come from the `secrets:` list below, which tools/docker-entrypoint.sh
      # loads over the top of these values.
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}

      # OpenTelemetry (Level 2 Jaeger via ggdc-shared-net)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=ghost-backend
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=ggdc,deployment.environment=development

      # External services
      - ANTHROPIC_ADMIN_API_KEY=${ANTHROPIC_ADMIN_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_PAT=${GITHUB_PAT}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount only necessary directories, not entire codebase
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      # For development only - hot reload
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
    secrets:
      - jwt_secret
      - api_key
    networks:
      - ghost-backend-net
      - ghost-backend-data
      - ggdc-shared-net
    labels:
      traefik.enable: "true"
      # api.ggdc.local, not api.ghost.local: .ggdc.local is the fleet domain and
      # the only one the Traefik cert covers (SANs: *.ggdc.local,
      # *.grayghostdata.local, localhost). Matches grafana/jaeger/prometheus.
      traefik.http.routers.ghost-backend.rule: "Host(`api.ggdc.local`)"
      # entrypoint `web`, matching every other Level 2 service in
      # docker/compose.infra.yml. docker-compose.prod.yml uses websecure — that
      # split is deliberate, not drift.
      traefik.http.routers.ghost-backend.entrypoints: "web"
      # This container is on two networks; without this Traefik may pick
      # ghost-backend-net, which it is not attached to, and the route blackholes.
      traefik.docker.network: "ggdc-shared-net"
      traefik.http.services.ghost-backend.loadbalancer.server.port: "8801"
      com.ggdc.project: "ghost-backend"
      com.ggdc.service: "ghost-be-api"
      com.ggdc.level: "2"
      com.ggdc.scrape: "true"
      com.ggdc.metrics_port: "8801"
    logging: *common-logging
    restart: unless-stopped
    healthcheck:
      # Proxy vars cleared so a Proxyman session on the host cannot intercept the
      # liveness probe and fail a healthy container (the-system does the same).
      # 127.0.0.1, not localhost — localhost can resolve to ::1, which uvicorn
      # is not bound to. curl (not wget) because the image installs curl and CI
      # (.github/workflows/ci.yml, docker-compose.ci.yml) probes with it too.
      test: ["CMD-SHELL", "HTTP_PROXY= HTTPS_PROXY= http_proxy= https_proxy= curl -fsS http://127.0.0.1:8801/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16.12-alpine
    container_name: ghost-be-db
    <<: *default-resources
    environment:
      - POSTGRES_DB=ghost
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ghost_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      # Only expose to localhost. Internal services use network
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount init scripts
      # - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    logging: *common-logging
    networks:
      - ghost-backend-data
    labels:
      com.ggdc.project: "ghost-backend"
      com.ggdc.service: "ghost-be-db"
      com.ggdc.level: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ghost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  redis:
    image: redis:7-alpine
    container_name: ghost-be-redis
    <<: *small-resources
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    environment:
      # Same value the command interpolates, exported so the healthcheck below
      # can authenticate. `command` interpolation happens at compose parse time
      # and leaves nothing readable inside the container.
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    ports:
      # Only expose to localhost. Internal services use network
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    logging: *common-logging
    networks:
      - ghost-backend-data
    labels:
      com.ggdc.project: "ghost-backend"
      com.ggdc.service: "ghost-be-redis"
      com.ggdc.level: "2"
    restart: unless-stopped
    healthcheck:
      # Must authenticate — the server runs with --requirepass, and an
      # unauthenticated PING still answers (NOAUTH), so a bare `redis-cli ping`
      # reports healthy even when the password is wrong.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ghost-be-pg-exporter
    <<: *small-resources
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${DB_PASSWORD:-ghost_password}@postgres:5432/ghost?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - ghost-backend-data
      - ggdc-shared-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.ggdc.project: "ghost-backend"
      com.ggdc.service: "ghost-be-pg-exporter"
      com.ggdc.level: "2"
      com.ggdc.scrape: "true"
      com.ggdc.metrics_port: "9187"
    logging: *common-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "HTTP_PROXY= HTTPS_PROXY= http_proxy= https_proxy= wget -q --spider http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    container_name: ghost-be-redis-exporter
    <<: *small-resources
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:9188:9121"
    networks:
      - ghost-backend-data
      - ggdc-shared-net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      com.ggdc.project: "ghost-backend"
      com.ggdc.service: "ghost-be-redis-exporter"
      com.ggdc.level: "2"
      com.ggdc.scrape: "true"
      com.ggdc.metrics_port: "9121"
    logging: *common-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "HTTP_PROXY= HTTPS_PROXY= http_proxy= https_proxy= wget -qO /dev/null http://127.0.0.1:9121/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Streamlit dashboard runs on the HOST (not in a container) via `make dashboard`.
  # Running it in compose causes port conflicts with the already-running podman stack.
  # See tools/streamlit_dashboard.py for the dashboard source.

networks:
  ghost-backend-net:
    name: ghost-backend-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Data tier — postgres, redis, the two exporters, and the app. Segregated from
  # ghost-backend-net so nothing else on the app tier can address the datastores.
  #
  # NOT `internal: true`, despite the-system marking its data net that way
  # (the-system/docker-compose.yml:919-924). internal removes the gateway, and
  # Docker then cannot publish host ports from containers on that network —
  # verified 2026-07-27: with internal set, 127.0.0.1:5433 and :6380 both went
  # unreachable, which breaks `make test-integration` (Makefile connects over
  # exactly those two ports) and any host-side psql/redis-cli.
  #
  # the-system gets away with it because its database/redis publish on 5440/6379
  # for host access *and* it accepts that; if egress blocking becomes a
  # requirement here, the way to get both is to drop the host publishing and run
  # integration tests inside a container on this network.
  ghost-backend-data:
    name: ghost-backend-data
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  ggdc-shared-net:
    external: true
    name: ggdc-shared-net

volumes:
  postgres_data:
    name: ghost-be-postgres-data
    driver: local
  redis_data:
    name: ghost-be-redis-data
    driver: local
